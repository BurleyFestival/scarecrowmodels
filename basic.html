<!doctype HTML>
<html>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<!--script src="js/aframe.min.js"></script-->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="js/aframe-ar.js"></script>
<!--script src="https://google-ar.github.io/three.ar.js/dist/three.ar.js"></script>
<script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script-->
<script src="js/aframe-multisrc-component.js"></script>
<body style="margin: 0px; overflow: hidden;">
  
<!-- set detectionMode and matrixCodeType to enable barcode marker detection and custom pattern files -->

<a-scene embedded vr-mode-ui="enabled: false;" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"><!-- 3x3_hamming_6_3 -->

    <a-assets>
		<img id="grid" src="images/border.png" />
		<img id="bsf-sphere" src="images/bsfsquare.jpg">
		<a-asset-item id="teapot" src="models/kettle.gltf"></a-asset-item>		    
		<a-asset-item id="cap" src="models/cap.glb"></a-asset-item>
		<a-asset-item id="pudding" src="models/yorkpud-png.glb"></a-asset-item>
		<a-asset-item id="terrier" src="models/yorkshireterrier-opt.glb"></a-asset-item>	  		
		<!--a-asset-item id="tree" src="models/tree.gltf"></a-asset-item-->	    
        <img id="xpos" src="images/box-sides/righttopflower.jpg">
        <img id="xneg" src="images/box-sides/otherflower.jpg">
        <img id="ypos" src="images/box-sides/bottomflower.jpg">
        <img id="yneg" src="images/box-sides/rightflower.jpg">
        <img id="zpos" src="images/box-sides/midFlower.jpg">
        <img id="zneg" src="images/box-sides/leftFlower.jpg">	
		<img id="earth-sphere" src="images/earth-sphere.jpg" />
	</a-assets>
    
    <!--a-marker type="pattern" url="data/kanji.patt">
        <a-box position="0 0.5 0" 
               material="color: red; transparent: true; opacity: 0.50;">
        </a-box>
    </a-marker-->

    <a-marker type="barcode" value="0">
        <a-entity   position="0 0 0" 
                    rotation="0 0 0"                    
					scale="0.90 0.90 0.90"
                    gltf-model="#teapot"  	
		animation__rotate = "property: rotation; dur: 9000; easing: linear; dir: normal; from:0 0 0; to: 360 0 0; loop: true;">
        </a-entity>
    </a-marker>

    <a-marker type="barcode" value="1">
        <a-entity   position="0 0 0" 
                    rotation="0 3 0"
                    scale="0.25 0.25 0.25"
                    gltf-model="#terrier" 	
		animation__rotate = "property: rotation; dur: 9000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
        </a-entity>
	    
    </a-marker>

    <a-marker type="barcode" value="2">
        <a-sphere position="0 0.5 0" 
               material="src: #bsf-sphere; transparent: true; opacity: 0.95;"
		                    scale="3 3 3"
		animation__rotate = "property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 360 0 0; loop: true;">
        </a-sphere>
    </a-marker>

    <a-marker type="barcode" value="3">
        <a-box position="0 0.5 0"
               multisrc="srcs:#xpos,#xneg,#ypos,#yneg,#zpos,#zneg"
               material="transparent: true; opacity: 0.95; side: double;"
		                    scale="3.0 3.0 3.0"		
		animation__rotate = "property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">		
        </a-box>
    </a-marker>

    <a-marker type="barcode" value="4">
        <a-entity   position="0 0 0" 
                    rotation="2 1 2"
                    scale="70 70 70"
                    gltf-model="#pudding" 	
		animation__rotate = "property: rotation; dur: 9900; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
        </a-entity>
    </a-marker>

    <a-marker type="barcode" value="5">
        <a-entity   position="0 0 0" 
                    rotation="1 1 1"
                    scale="1 1 1"
                    gltf-model="#terrier" 	
		animation__rotate = "property: rotation; dur: 9990; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
        </a-entity>
    </a-marker>

    <a-marker type="barcode" value="6">
		<a-sphere position="0 0.5 0" 
               material="src: #earth-sphere; transparent: true; opacity: 0.95;"
               animation__rotate = "property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
        </a-sphere>
    </a-marker>
	
    <a-entity camera></a-entity>
    
</a-scene>
</body>
</html>
